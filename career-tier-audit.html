<!DOCTYPE html>
<html lang="en"> 

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Career Tier Audit</title>

<link rel="stylesheet" href="career-tier-audit.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<section id="landing">

<h1>Career Tier Audit</h1>

<p class="subtitle">
Discover your career tier, income potential, and hidden career value gap.
</p>

<button class="startBtn" onclick="startAudit()">
Start Career Tier Audit
</button>

<p class="timeNote">~3 minutes • 20 questions</p>

</section>


<section id="quizSection" class="hidden">

<div class="progress-bar">
<div id="progressFill"></div>
</div>

<p id="progressText"></p>

<h2 id="question"></h2>

<div id="answers"></div>

</section>


<section id="leadForm" class="hidden">

<h2>Get Your Result</h2>

<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="age" placeholder="Age">
<input id="city" placeholder="City">
<input id="role" placeholder="Current Role">

<select id="currentIncome">
<option value="5">Under 5M</option>
<option value="10">5–10M</option>
<option value="20">10–20M</option>
<option value="40">20–40M</option>
<option value="80">40M+</option>
</select>

<button onclick="submitLead()">See My Result</button>

</section>


<section id="result" class="hidden">

<h2>Your Career Tier</h2>

<p id="tier"></p>
<p id="income"></p>
<p id="gap"></p>

<canvas id="careerChart"></canvas>

<a class="cta" href="https://calendly.com/" target="_blank">
Book 1-on-1 Free Career Tier Strategy Call
</a>

</section>

</div>

<script src="career-tier-audit.js"></script>

</body>
</html>
